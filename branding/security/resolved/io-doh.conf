# systemd-resolved drop-in shipped to /etc/systemd/resolved.conf.d/.
# Forces DNS-over-TLS (the systemd term for our use case; resolved
# doesn't speak DoH directly today, DoT to the same providers gets us
# the same encrypted-DNS guarantee). DNSSEC validation is on; if a
# misconfigured resolver returns broken DNSSEC, we fall through to the
# fallback resolver rather than silently going clear-text.
#
# Defaults below are Quad9 + Cloudflare; both have audited no-log
# policies. Users / admins can override by dropping a higher-numbered
# file (e.g. /etc/systemd/resolved.conf.d/99-local.conf).

[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net 2620:fe::9#dns.quad9.net
FallbackDNS=1.1.1.1#cloudflare-dns.com 2606:4700:4700::1111#cloudflare-dns.com
DNSSEC=allow-downgrade
DNSOverTLS=opportunistic
MulticastDNS=yes
LLMNR=no
Cache=yes
CacheFromLocalhost=no
ReadEtcHosts=yes
