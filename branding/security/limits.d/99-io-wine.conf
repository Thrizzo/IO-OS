# Raise FD limits so Wine's esync sync primitive has the headroom it
# needs. Wine creates one eventfd per Win32 sync object; large games
# blow past the default 1024 within the first minute.
#
# 524288 matches what Steam's runtime asks for and is what Proton
# expects to be present.

*       soft    nofile  524288
*       hard    nofile  1048576
root    soft    nofile  524288
root    hard    nofile  1048576
