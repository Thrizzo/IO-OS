# Load the NTSYNC kernel module on boot when present (Linux 6.10+).
# Provides /dev/ntsync, which Wine prefers over esync for native
# Windows-style synchronisation primitives. ~10–15% wins on heavy
# multi-threaded Windows workloads (game engines, build systems).
#
# A leading dash means "don't fail boot if the module is missing".
# That keeps older kernels happy while still picking up NTSYNC
# automatically once the user dist-upgrades into a 6.10+ kernel.

-ntsync
