<?xml version="1.0" encoding="UTF-8"?>
<!--
  IO Linux logo. Compact mark for app icons, taskbar launcher, SDDM/Plymouth.
  Stylized Io moon (no text) so it works at 16px and 512px.
  Palette: navy #1a2332, amber #D4A24A.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 256 256"
     width="256" height="256">
  <defs>
    <radialGradient id="ioBody" cx="35%" cy="35%" r="70%">
      <stop offset="0%"  stop-color="#F4D279"/>
      <stop offset="50%" stop-color="#D4A24A"/>
      <stop offset="90%" stop-color="#8B6020"/>
      <stop offset="100%" stop-color="#3A2810"/>
    </radialGradient>
    <radialGradient id="ioRing" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#D4A24A" stop-opacity="0"/>
      <stop offset="92%" stop-color="#D4A24A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#D4A24A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Navy backdrop disc so the mark works on light or dark surfaces. -->
  <circle cx="128" cy="128" r="124" fill="#1a2332"/>
  <circle cx="128" cy="128" r="124" fill="none" stroke="#D4A24A" stroke-width="2" opacity="0.6"/>

  <!-- Glow -->
  <circle cx="128" cy="128" r="100" fill="url(#ioRing)"/>

  <!-- Io body -->
  <circle cx="128" cy="128" r="78" fill="url(#ioBody)"/>

  <!-- A couple of volcanic patches so the body reads as Io, not a generic moon. -->
  <ellipse cx="105" cy="115" rx="14" ry="9"  fill="#8B6020" opacity="0.55"/>
  <ellipse cx="145" cy="145" rx="20" ry="11" fill="#6B4818" opacity="0.55"/>
  <ellipse cx="155" cy="100" rx="10" ry="7"  fill="#A87530" opacity="0.45"/>
</svg>
