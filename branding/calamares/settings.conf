# Calamares pipeline for IO Linux.
# Path: /etc/calamares/settings.conf inside the image.
#
# The order below is what the installer steps through. Compared to
# upstream openSUSE Calamares we:
#   - force LUKS2 partitioning (the partition module honours
#     overrides in modules/partition.conf)
#   - drop a post-install systemd-cryptenroll TPM2 binding via the
#     `shellprocess` module so the user doesn't have to type their
#     LUKS passphrase on every boot when the boot chain is intact
#   - print a mandatory recovery key before reboot
#
# Every line that diverges from upstream is annotated.

---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id: io-tpm2-enroll
    module: shellprocess
    config: shellprocess-tpm2.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - networkcfg
      - hwclock
      - services-systemd
      - grubcfg
      - bootloader
      - shellprocess@io-tpm2-enroll   # IO add: TPM2-bind LUKS, print recovery
      - packages
      - plymouthcfg
      - initramfs
      - removeuser
      - finished
  - show:
      - finished

branding: io
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
