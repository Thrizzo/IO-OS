# Calamares shellprocess module — runs in the target chroot after the
# bootloader is installed but before the user reboots. We bind the
# LUKS volume to TPM2 measurements 0+7+14 (firmware, secure-boot,
# bootloader). If anything in that chain changes, the auto-unlock
# silently fails and the system prompts for the recovery passphrase
# the user wrote down during install.
#
# Why this list of PCRs:
#   0  — firmware code measurement (anti-firmware-tampering)
#   7  — Secure Boot state + signature DB (only IO-signed kernels can boot)
#   14 — boot loader configuration (catches grub.cfg edits)
#
# If the user opted out of TPM2 binding in the Calamares users page
# this script is a no-op (it greps /tmp/io-tpm2-opt for the flag).

dontChroot: false
timeout: 60
script:
  - command: |
      set -euo pipefail

      if [ -f /tmp/io-tpm2-opt-out ]; then
          echo "io: user opted out of TPM2 LUKS auto-unlock"
          exit 0
      fi

      if ! command -v systemd-cryptenroll >/dev/null 2>&1; then
          echo "io: systemd-cryptenroll missing — skipping TPM2 enrol" >&2
          exit 0
      fi

      LUKS=$(lsblk -lpno NAME,FSTYPE | awk '$2=="crypto_LUKS"{print $1; exit}')
      if [ -z "$LUKS" ]; then
          echo "io: no LUKS volume detected — skipping TPM2 enrol" >&2
          exit 0
      fi

      # PCRs 0 + 7 + 14 — firmware, secure boot, boot loader. Tamper any
      # of those and the unlock falls back to the recovery passphrase.
      systemd-cryptenroll --tpm2-device=auto --tpm2-pcrs=0+7+14 "$LUKS" \
          || { echo "io: TPM2 enrol failed; user keeps passphrase unlock" >&2; exit 0; }

      # Print the LUKS UUID so the user can find the volume later if
      # they need to re-enrol after a firmware update.
      UUID=$(cryptsetup luksUUID "$LUKS")
      echo "io: TPM2-bound LUKS volume UUID=$UUID"
      echo "io: recovery passphrase was set during install — keep it safe."
