# Calamares partition module — IO preset.
# Path: /etc/calamares/modules/partition.conf inside the image.
#
# What changes from upstream openSUSE:
#   - `defaultFileSystemType: btrfs`           — Kalpa expects btrfs
#   - `enableLuksAutomatedPartitioning: true`  — encrypt by default
#   - `defaultFileSystemConfiguration` sets noatime + compress=zstd
#   - `swapPartitionName` removed; we use zram instead (see kiwi/config.sh)
#
# Users can still pick "manual partitioning" if they want a different
# layout — these are only the defaults for the guided flow.

efiSystemPartition:     "/boot/efi"
efiSystemPartitionSize: 512MiB
efiSystemPartitionName: EFI

userSwapChoices:
  - none
  - file
  # Deliberately no "swap partition" option — zram is enabled at boot.

drawNestedPartitions: true
alwaysShowPartitionLabels: true

initialPartitioningChoice: erase
initialSwapChoice: none
allowManualPartitioning: true

defaultFileSystemType: btrfs

partitionLayout:
  - name: rootMountPoint
    filesystem: btrfs
    mountPoint: "/"
    size: 100%
    features:
      noCow: false

luksGeneration: luks2
enableLuksAutomatedPartitioning: true

# Once Calamares supports inline TPM2 enrol it lives here. Until then
# the shellprocess module (settings.conf -> shellprocess@io-tpm2-enroll)
# binds the TPM after the LUKS volume is created.
