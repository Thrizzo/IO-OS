name: Build IO Linux ISO

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    # 03:00 UTC nightly — only runs on the default branch.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      run_smoke_test:
        description: "Boot the OBS-built ISO under QEMU and check Plasma loads"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Cheap static checks. Should pass today on every push.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax (bash -n)
        run: |
          set -euo pipefail
          # Auto-discover so new shell scripts get linted without editing CI.
          mapfile -t scripts < <(
              find . -type f \
                  \( -name '*.sh' -o -name '*-launcher' -o -name 'config.sh' \) \
                  -not -path './.git/*'
          )
          for f in "${scripts[@]}"; do
              echo "  bash -n $f"
              bash -n "$f"
          done

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning

      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils jq yamllint qml6-module-qtquick

      - name: Validate Kiwi XML
        run: xmllint --noout kiwi/config.xml

      - name: Validate JSON (jq)
        run: |
          set -euo pipefail
          mapfile -t json_files < <(find . -type f -name '*.json' -not -path './.git/*')
          for f in "${json_files[@]}"; do
              echo "  jq . $f"
              jq -e . "$f" >/dev/null
          done

      - name: Validate YAML (yamllint)
        run: |
          cat > /tmp/yamllint.yml <<'YAML'
          extends: default
          rules:
            line-length:
              max: 120
            document-start: disable
          YAML
          yamllint -c /tmp/yamllint.yml .github/

      - name: Validate SVG well-formedness
        run: |
          set -euo pipefail
          mapfile -t svgs < <(find branding -type f -name '*.svg')
          for f in "${svgs[@]}"; do
              echo "  xmllint --noout $f"
              xmllint --noout "$f"
          done

      - name: Validate QML (qmllint)
        # qmllint is best-effort: warnings are surfaced but do not fail the
        # build, since some Plasma-only imports aren't resolvable on CI.
        continue-on-error: true
        run: |
          set -euo pipefail
          mapfile -t qmls < <(find . -type f -name '*.qml' -not -path './.git/*')
          for f in "${qmls[@]}"; do
              echo "  qmllint $f"
              qmllint "$f" || true
          done

  # Nightly OBS rebuild — only runs on schedule or manual dispatch, and
  # only when the OBS secrets are configured. We do NOT build the ISO
  # from scratch in CI runners (slow, requires root/loopback) — instead
  # we trigger the canonical OBS project and publish the resulting ISO.
  nightly:
    name: Nightly ISO via OBS
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Check for OBS credentials
        id: secrets
        run: |
          if [ -n "${{ secrets.OBS_API_USER }}" ] && [ -n "${{ secrets.OBS_API_PASS }}" ]; then
              echo "have_secrets=true" >> "$GITHUB_OUTPUT"
          else
              echo "have_secrets=false" >> "$GITHUB_OUTPUT"
              # Warn-only on schedule (so a fresh fork's nightly cron doesn't
              # spam failures); hard-fail on manual dispatch (the human asked
              # for a build, they should know it didn't happen).
              if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                  echo "::error::OBS_API_USER / OBS_API_PASS not configured."
                  exit 1
              else
                  echo "::warning::OBS_API_USER / OBS_API_PASS not configured — skipping nightly build."
              fi
          fi

      - name: Install osc
        if: steps.secrets.outputs.have_secrets == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osc

      - name: Configure osc credentials
        if: steps.secrets.outputs.have_secrets == 'true'
        env:
          OBS_API_USER: ${{ secrets.OBS_API_USER }}
          OBS_API_PASS: ${{ secrets.OBS_API_PASS }}
        run: |
          mkdir -p ~/.config/osc
          # 0600 because the token sits in this file in plain text.
          umask 077
          cat > ~/.config/osc/oscrc <<EOF
          [general]
          apiurl = https://api.opensuse.org
          [https://api.opensuse.org]
          user = $OBS_API_USER
          pass = $OBS_API_PASS
          EOF

      - name: Trigger OBS rebuild
        if: steps.secrets.outputs.have_secrets == 'true'
        env:
          OBS_PROJECT: ${{ vars.OBS_PROJECT || 'home:thrizzo:io-linux' }}
          OBS_PACKAGE: ${{ vars.OBS_PACKAGE || 'io-linux' }}
        run: |
          set -euo pipefail
          # Don't error on the project not existing yet — emit a clear
          # warning and skip downstream steps cleanly so the workflow stays
          # green during early-stage forks.
          if ! osc list "$OBS_PROJECT" >/dev/null 2>&1; then
              echo "::warning::OBS project $OBS_PROJECT not reachable — nothing to rebuild."
              echo "obs_skip=true" >> "$GITHUB_ENV"
              exit 0
          fi
          osc rebuild "$OBS_PROJECT" "$OBS_PACKAGE"

      - name: Poll osc until build settles
        if: steps.secrets.outputs.have_secrets == 'true' && env.obs_skip != 'true'
        env:
          OBS_PROJECT: ${{ vars.OBS_PROJECT || 'home:thrizzo:io-linux' }}
          OBS_PACKAGE: ${{ vars.OBS_PACKAGE || 'io-linux' }}
          OBS_TIMEOUT_MIN: "60"
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + OBS_TIMEOUT_MIN * 60 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
              # `osc results` exits 0 even mid-build; we grep for terminal
              # states. Any "broken", "failed", or "unresolvable" => fail.
              status=$(osc results --csv "$OBS_PROJECT" "$OBS_PACKAGE" || true)
              echo "$status"
              if echo "$status" | grep -qE '(failed|broken|unresolvable)'; then
                  echo "::error::OBS reports a non-success state for $OBS_PACKAGE."
                  echo "$status"
                  exit 1
              fi
              if echo "$status" | grep -qE 'succeeded' \
                 && ! echo "$status" | grep -qE '(building|scheduled|blocked|dispatching|finished)'; then
                  echo "==> All targets succeeded."
                  break
              fi
              sleep 60
          done
          if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out after ${OBS_TIMEOUT_MIN} min waiting for OBS."
              exit 1
          fi

      - name: Fetch ISO binaries
        id: fetch
        if: steps.secrets.outputs.have_secrets == 'true' && env.obs_skip != 'true'
        env:
          OBS_PROJECT: ${{ vars.OBS_PROJECT || 'home:thrizzo:io-linux' }}
          OBS_PACKAGE: ${{ vars.OBS_PACKAGE || 'io-linux' }}
          OBS_REPO: ${{ vars.OBS_REPO || 'images' }}
          OBS_ARCH: ${{ vars.OBS_ARCH || 'x86_64' }}
        run: |
          set -euo pipefail
          mkdir -p out
          osc getbinaries "$OBS_PROJECT" "$OBS_PACKAGE" "$OBS_REPO" "$OBS_ARCH" out/
          ls -lh out/
          # Generate a checksum manifest for the published artefacts.
          ( cd out && find . -name '*.iso' -exec sha256sum {} \; > SHA256SUMS )
          # Pick the first ISO (there should be exactly one) for the smoke
          # job downstream.
          iso_path=$(find out -maxdepth 2 -name '*.iso' | head -n1)
          echo "iso_path=$iso_path" >> "$GITHUB_OUTPUT"

      - name: Upload ISO + checksums
        if: steps.secrets.outputs.have_secrets == 'true' && env.obs_skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: io-linux-iso
          path: |
            out/**/*.iso
            out/SHA256SUMS
          retention-days: 30
          if-no-files-found: error

  # Optional QEMU smoke boot. Pulls the ISO from the nightly job and verifies
  # the kernel + initrd come up far enough to spawn SDDM. GitHub-hosted
  # runners don't expose KVM, so the boot uses TCG and is correspondingly
  # slow — gated on workflow_dispatch input to avoid burning CI minutes.
  smoke:
    name: QEMU smoke boot
    runs-on: ubuntu-latest
    needs: nightly
    if: github.event_name == 'workflow_dispatch' && inputs.run_smoke_test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU (TCG)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf

      - name: Download ISO
        uses: actions/download-artifact@v4
        with:
          name: io-linux-iso
          path: artefacts

      - name: Boot ISO under QEMU and watch serial
        run: |
          set -euo pipefail
          iso=$(find artefacts -name '*.iso' | head -n1)
          if [ -z "$iso" ]; then
              echo "::error::no ISO in artefacts/"
              exit 1
          fi
          echo "==> booting $iso under TCG (no KVM on hosted runners)"
          # Capture serial output to a file so we can grep for the SDDM
          # cue. Background QEMU and kill it once we've seen the marker
          # or hit the timeout.
          qemu-system-x86_64 \
              -m 2G -smp 2 \
              -bios /usr/share/ovmf/OVMF.fd \
              -drive file="$iso",media=cdrom,readonly=on \
              -boot d \
              -display none \
              -serial file:serial.log \
              -no-reboot \
              -nographic \
              -nic none \
              -daemonize \
              -pidfile qemu.pid

          # Look for the SDDM greeter cue or kernel boot completion. Either
          # is sufficient evidence the ISO is bootable.
          deadline=$(( $(date +%s) + 900 ))   # 15 min
          ok=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
              if grep -qE 'sddm|Reached target Graphical|kdeinit5_wrapper|plasmashell' serial.log 2>/dev/null; then
                  ok=1
                  break
              fi
              sleep 5
          done

          # Always kill QEMU and dump the tail of serial output for diagnosis.
          if [ -f qemu.pid ]; then
              kill "$(cat qemu.pid)" 2>/dev/null || true
          fi
          echo "---- last 80 lines of serial.log ----"
          tail -n 80 serial.log || true

          if [ "$ok" -ne 1 ]; then
              echo "::error::ISO did not reach the SDDM greeter within timeout"
              exit 1
          fi
          echo "==> smoke boot succeeded"
